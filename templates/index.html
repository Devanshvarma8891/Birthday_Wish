<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎁 Birthday Surprise Generator</title>
    <style>
        body {
            background-color: #9aebe7;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding: 50px;
            color: #444;
        }
        h1 {
            font-size: 3em;
            color: #e91e63;
        }
        h2 {
            font-size: 2em;
            color: #1b4369;
        }
        input {
            padding: 12px;
            width: 300px;
            border: 2px solid #e91e63;
            border-radius: 10px;
            font-size: 1em;
        }
        button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #ff4081;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #e91e63;
        }
        .emoji {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="emoji">🎂🎈🎁🎊</div>
    <h1>A Special Surprise, Just for You 🎁🎉!</h1>

    <form method="post">
        <input type="text" name="name" placeholder="Enter your name 💖" required autocomplete="off">
        <br>
        <button type="submit">✨ Ready ✨</button>
    </form>
</body>
</html>
